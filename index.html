<!doctype html>
<html lang="pt-BR" class="h-full w-full select-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="O Self de Pandora - Um jogo de plataforma 3D psicológico, abstrato e atmosférico sobre autodescoberta." />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <title>O Self de Pandora | Plataforma Psicológica 3D</title>
  </head>
  <body class="bg-[#0c0c0e] text-[#e2e2e7] w-full h-full overflow-hidden m-0 p-0 font-sans antialiased">
    
    <!-- Container Principal do App -->
    <div id="app" class="relative w-full h-full flex justify-center items-center overflow-hidden">
      
      <!-- Container do Canvas do Three.js (3D) -->
      <div id="game-container" class="absolute inset-0 w-full h-full z-0 bg-radial from-[#121215] to-[#040405]"></div>
      
      <!-- Overlays da Interface do Usuário (Base) -->
      <div id="ui-layer" class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-center items-center w-full h-full"></div>

      <!-- Efeito de Tela CRT Retro -->
      <div id="crt-overlay" class="absolute inset-0 pointer-events-none z-[50] transition-opacity duration-300"></div>

      <!-- Overlays da Interface do Usuário (Topo - Acima do CRT) -->
      <div id="ui-layer-top" class="absolute inset-0 z-[60] pointer-events-none flex flex-col justify-center items-center w-full h-full"></div>

    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
